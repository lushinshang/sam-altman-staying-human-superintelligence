<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 870 278" width="870" height="278" role="img" aria-labelledby="t d" font-family='"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif'><title id="t">他描述的數學界反應：五天轉了一圈</title><desc id="d">時間軸：奧特曼在 22:09 到 23:17 轉述數學界近十天的反應。第 0 天：這是假的；第 1 天：我們完了，叫研究生轉系；第 3 天：OpenAI 做這件事很可怕，若這是理解更多數學的代價就不要；第 5 天左右：有一種數學工作結束了，但多數人做的是理解、溝通與呈現知識。這是講者的轉述，不是調查。本文歸納，非講者原圖。</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b5750"/></marker></defs><rect x="0" y="0" width="870" height="278" rx="14" fill="#fffdf9" stroke="#d9d3c7"/><text x="30" y="44" font-size="24" font-weight="700" fill="#1a1a1a" text-anchor="start"><tspan x="30" dy="0">他描述的數學界反應：五天轉了一圈</tspan></text><line x1="30" y1="90.8" x2="840" y2="90.8" stroke="#6b665d" stroke-width="3"/><circle cx="44" cy="90.8" r="9" fill="#6b665d"/><text x="60" y="96.8" font-size="18" font-weight="700" fill="#6b665d" text-anchor="start"><tspan x="60" dy="0">第 0 天</tspan></text><rect x="30" y="116.8" width="189" height="91.36" rx="12" fill="#efece5" stroke="#6b665d" stroke-width="2"/><text x="124.5" y="146.8" font-size="16" font-weight="400" fill="#1a1a1a" text-anchor="middle"><tspan x="124.5" dy="0">「這是假的」</tspan></text><circle cx="251" cy="90.8" r="9" fill="#b3392b"/><text x="267" y="96.8" font-size="18" font-weight="700" fill="#b3392b" text-anchor="start"><tspan x="267" dy="0">第 1 天</tspan></text><rect x="237" y="116.8" width="189" height="91.36" rx="12" fill="#fbe4e1" stroke="#b3392b" stroke-width="2"/><text x="331.5" y="146.8" font-size="16" font-weight="400" fill="#1a1a1a" text-anchor="middle"><tspan x="331.5" dy="0">「我們完了，叫研究生</tspan><tspan x="331.5" dy="22.08">轉系」</tspan></text><circle cx="458" cy="90.8" r="9" fill="#b3392b"/><text x="474" y="96.8" font-size="18" font-weight="700" fill="#b3392b" text-anchor="start"><tspan x="474" dy="0">第 3 天</tspan></text><rect x="444" y="116.8" width="189" height="91.36" rx="12" fill="#fbe4e1" stroke="#b3392b" stroke-width="2"/><text x="538.5" y="146.8" font-size="16" font-weight="400" fill="#1a1a1a" text-anchor="middle"><tspan x="538.5" dy="0">「OpenAI 做這件事</tspan><tspan x="538.5" dy="22.08">很可怕；若這是代價，</tspan><tspan x="538.5" dy="22.08">我們不要」</tspan></text><circle cx="665" cy="90.8" r="9" fill="#0b5c51"/><text x="681" y="96.8" font-size="18" font-weight="700" fill="#0b5c51" text-anchor="start"><tspan x="681" dy="0">第 5 天左右</tspan></text><rect x="651" y="116.8" width="189" height="91.36" rx="12" fill="#dff1e8" stroke="#0b5c51" stroke-width="2"/><text x="745.5" y="146.8" font-size="16" font-weight="400" fill="#1a1a1a" text-anchor="middle"><tspan x="745.5" dy="0">「有一種數學工作結束</tspan><tspan x="745.5" dy="22.08">了，但多數人做的是理</tspan><tspan x="745.5" dy="22.08">解、溝通、呈現知識」</tspan></text><text x="435" y="253.16" font-size="17" font-weight="700" fill="#5b5750" text-anchor="middle"><tspan x="435" dy="0">22:09–23:17 奧特曼的轉述，不是調查</tspan></text></svg>

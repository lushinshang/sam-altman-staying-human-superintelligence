<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 870 402" width="870" height="402" role="img" aria-labelledby="t d" font-family='"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif'><title id="t">開源模型：哪些壞事要接受，線畫在哪裡</title><desc id="d">分區圖：門檻以下，奧特曼說開源模型會帶來仇恨言論、在網路論壇鬧事、入侵部分系統、代使用者行騙、新一代電話詐騙，但不該因此禁掉所有開源模型；門檻要由社會辯論；門檻以上誰都不該能做到：讓網際網路癱瘓、對他人造成身體傷害、發動新型生物恐怖攻擊。另註：他說目前最好的內部模型短期內不能負責任地開源。本文歸納，非講者原圖。</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b5750"/></marker></defs><rect x="0" y="0" width="870" height="402" rx="14" fill="#fffdf9" stroke="#d9d3c7"/><text x="30" y="44" font-size="24" font-weight="700" fill="#1a1a1a" text-anchor="start"><tspan x="30" dy="0">開源模型：哪些壞事要接受，線畫在哪裡</tspan></text><rect x="30" y="70.8" width="810" height="98.8" rx="12" fill="#fbe4e1" stroke="#b3392b" stroke-width="2"/><text x="46" y="103.8" font-size="19" font-weight="700" fill="#b3392b" text-anchor="start"><tspan x="46" dy="0">39:22 門檻以上：誰都不該能做到</tspan></text><rect x="46" y="119.6" width="140" height="34" rx="17" fill="#fffdf9" stroke="#b3392b" stroke-width="1.5"/><text x="116" y="143.6" font-size="16" font-weight="400" fill="#1a1a1a" text-anchor="middle"><tspan x="116" dy="0">讓網際網路癱瘓</tspan></text><rect x="196" y="119.6" width="172" height="34" rx="17" fill="#fffdf9" stroke="#b3392b" stroke-width="1.5"/><text x="282" y="143.6" font-size="16" font-weight="400" fill="#1a1a1a" text-anchor="middle"><tspan x="282" dy="0">對他人造成身體傷害</tspan></text><rect x="378" y="119.6" width="188" height="34" rx="17" fill="#fffdf9" stroke="#b3392b" stroke-width="1.5"/><text x="472" y="143.6" font-size="16" font-weight="400" fill="#1a1a1a" text-anchor="middle"><tspan x="472" dy="0">發動新型生物恐怖攻擊</tspan></text><line x1="30" y1="191.6" x2="840" y2="191.6" stroke="#1a1a1a" stroke-width="3" stroke-dasharray="10 6"/><text x="435" y="219.6" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle"><tspan x="435" dy="0">39:10 門檻在哪裡，要由社會辯論</tspan></text><rect x="30" y="239.2" width="810" height="98.8" rx="12" fill="#efece5" stroke="#6b665d" stroke-width="2"/><text x="46" y="272.2" font-size="19" font-weight="700" fill="#6b665d" text-anchor="start"><tspan x="46" dy="0">38:11 門檻以下：會發生，但不該因此禁掉所有開源模型</tspan></text><rect x="46" y="288" width="92" height="34" rx="17" fill="#fffdf9" stroke="#6b665d" stroke-width="1.5"/><text x="92" y="312" font-size="16" font-weight="400" fill="#1a1a1a" text-anchor="middle"><tspan x="92" dy="0">仇恨言論</tspan></text><rect x="148" y="288" width="140" height="34" rx="17" fill="#fffdf9" stroke="#6b665d" stroke-width="1.5"/><text x="218" y="312" font-size="16" font-weight="400" fill="#1a1a1a" text-anchor="middle"><tspan x="218" dy="0">在網路論壇鬧事</tspan></text><rect x="298" y="288" width="124" height="34" rx="17" fill="#fffdf9" stroke="#6b665d" stroke-width="1.5"/><text x="360" y="312" font-size="16" font-weight="400" fill="#1a1a1a" text-anchor="middle"><tspan x="360" dy="0">入侵部分系統</tspan></text><rect x="432" y="288" width="124" height="34" rx="17" fill="#fffdf9" stroke="#6b665d" stroke-width="1.5"/><text x="494" y="312" font-size="16" font-weight="400" fill="#1a1a1a" text-anchor="middle"><tspan x="494" dy="0">代使用者行騙</tspan></text><rect x="566" y="288" width="140" height="34" rx="17" fill="#fffdf9" stroke="#6b665d" stroke-width="1.5"/><text x="636" y="312" font-size="16" font-weight="400" fill="#1a1a1a" text-anchor="middle"><tspan x="636" dy="0">新一代電話詐騙</tspan></text><text x="435" y="377" font-size="17" font-weight="700" fill="#1f5f99" text-anchor="middle"><tspan x="435" dy="0">43:15 目前最好的內部模型，短期內不能負責任地開源</tspan></text></svg>

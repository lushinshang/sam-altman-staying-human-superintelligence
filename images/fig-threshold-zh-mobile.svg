<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 593" width="420" height="593" role="img" aria-labelledby="t d" font-family='"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif'><title id="t">開源模型：哪些壞事要接受，線畫在哪裡</title><desc id="d">分區圖：門檻以下，奧特曼說開源模型會帶來仇恨言論、在網路論壇鬧事、入侵部分系統、代使用者行騙、新一代電話詐騙，但不該因此禁掉所有開源模型；門檻要由社會辯論；門檻以上誰都不該能做到：讓網際網路癱瘓、對他人造成身體傷害、發動新型生物恐怖攻擊。另註：他說目前最好的內部模型短期內不能負責任地開源。本文歸納，非講者原圖。</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b5750"/></marker></defs><rect x="0" y="0" width="420" height="593" rx="14" fill="#fffdf9" stroke="#d9d3c7"/><text x="24" y="41" font-size="21" font-weight="700" fill="#1a1a1a" text-anchor="start"><tspan x="24" dy="0">開源模型：哪些壞事要接受，線畫</tspan><tspan x="24" dy="28.98">在哪裡</tspan></text><rect x="24" y="96.18" width="372" height="138.4" rx="12" fill="#fbe4e1" stroke="#b3392b" stroke-width="2"/><text x="40" y="127.18" font-size="17" font-weight="700" fill="#b3392b" text-anchor="start"><tspan x="40" dy="0">39:22 門檻以上：誰都不該能做到</tspan></text><rect x="40" y="142.58" width="133" height="33" rx="16.5" fill="#fffdf9" stroke="#b3392b" stroke-width="1.5"/><text x="106.5" y="165.58" font-size="15" font-weight="400" fill="#1a1a1a" text-anchor="middle"><tspan x="106.5" dy="0">讓網際網路癱瘓</tspan></text><rect x="183" y="142.58" width="163" height="33" rx="16.5" fill="#fffdf9" stroke="#b3392b" stroke-width="1.5"/><text x="264.5" y="165.58" font-size="15" font-weight="400" fill="#1a1a1a" text-anchor="middle"><tspan x="264.5" dy="0">對他人造成身體傷害</tspan></text><rect x="40" y="185.58" width="178" height="33" rx="16.5" fill="#fffdf9" stroke="#b3392b" stroke-width="1.5"/><text x="129" y="208.58" font-size="15" font-weight="400" fill="#1a1a1a" text-anchor="middle"><tspan x="129" dy="0">發動新型生物恐怖攻擊</tspan></text><line x1="24" y1="256.58" x2="396" y2="256.58" stroke="#1a1a1a" stroke-width="3" stroke-dasharray="10 6"/><text x="210" y="283.58" font-size="17" font-weight="700" fill="#1a1a1a" text-anchor="middle"><tspan x="210" dy="0">39:10 門檻在哪裡，要由社會辯論</tspan></text><rect x="24" y="302.98" width="372" height="204.86" rx="12" fill="#efece5" stroke="#6b665d" stroke-width="2"/><text x="40" y="333.98" font-size="17" font-weight="700" fill="#6b665d" text-anchor="start"><tspan x="40" dy="0">38:11 門檻以下：會發生，但不該因此禁掉所</tspan><tspan x="40" dy="23.46">有開源模型</tspan></text><rect x="40" y="372.84" width="88" height="33" rx="16.5" fill="#fffdf9" stroke="#6b665d" stroke-width="1.5"/><text x="84" y="395.84" font-size="15" font-weight="400" fill="#1a1a1a" text-anchor="middle"><tspan x="84" dy="0">仇恨言論</tspan></text><rect x="138" y="372.84" width="133" height="33" rx="16.5" fill="#fffdf9" stroke="#6b665d" stroke-width="1.5"/><text x="204.5" y="395.84" font-size="15" font-weight="400" fill="#1a1a1a" text-anchor="middle"><tspan x="204.5" dy="0">在網路論壇鬧事</tspan></text><rect x="40" y="415.84" width="118" height="33" rx="16.5" fill="#fffdf9" stroke="#6b665d" stroke-width="1.5"/><text x="99" y="438.84" font-size="15" font-weight="400" fill="#1a1a1a" text-anchor="middle"><tspan x="99" dy="0">入侵部分系統</tspan></text><rect x="168" y="415.84" width="118" height="33" rx="16.5" fill="#fffdf9" stroke="#6b665d" stroke-width="1.5"/><text x="227" y="438.84" font-size="15" font-weight="400" fill="#1a1a1a" text-anchor="middle"><tspan x="227" dy="0">代使用者行騙</tspan></text><rect x="40" y="458.84" width="133" height="33" rx="16.5" fill="#fffdf9" stroke="#6b665d" stroke-width="1.5"/><text x="106.5" y="481.84" font-size="15" font-weight="400" fill="#1a1a1a" text-anchor="middle"><tspan x="106.5" dy="0">新一代電話詐騙</tspan></text><text x="210" y="545.84" font-size="16" font-weight="700" fill="#1f5f99" text-anchor="middle"><tspan x="210" dy="0">43:15 目前最好的內部模型，短期內不能負責任</tspan><tspan x="210" dy="22.08">地開源</tspan></text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 870 494" width="870" height="494" role="img" aria-labelledby="t d" font-family='"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif'><title id="t">最難的決定：兩個信念，推到三個問題</title><desc id="d">流程圖：奧特曼說最難的決定是暫停、控速或智慧速限。兩個信念：人要一直掌控未來，權力要相當分散；兩者都成立時，推到三個問題：能讓 AI 比最聰明的人聰明多少、多快、要把人的理解力提升多少；他認為可解但要時間，世界得一起同意限制怎麼訂。時間是訪談中的位置。本文歸納，非講者原圖。</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b5750"/></marker></defs><rect x="0" y="0" width="870" height="494" rx="14" fill="#fffdf9" stroke="#d9d3c7"/><text x="30" y="44" font-size="24" font-weight="700" fill="#1a1a1a" text-anchor="start"><tspan x="30" dy="0">最難的決定：兩個信念，推到三個問題</tspan></text><rect x="30" y="70.8" width="390" height="99.28" rx="12" fill="#e3ecfb" stroke="#1f5f99" stroke-width="2"/><text x="225" y="104.8" font-size="20" font-weight="700" fill="#1f5f99" text-anchor="middle"><tspan x="225" dy="0">人要一直掌控未來</tspan></text><text x="225" y="130.8" font-size="16" font-weight="400" fill="#1a1a1a" text-anchor="middle"><tspan x="225" dy="0">13:42 不把決策權不可逆地交給 AI，也不意</tspan><tspan x="225" dy="22.08">外失控</tspan></text><rect x="450" y="70.8" width="390" height="99.28" rx="12" fill="#e3ecfb" stroke="#1f5f99" stroke-width="2"/><text x="645" y="104.8" font-size="20" font-weight="700" fill="#1f5f99" text-anchor="middle"><tspan x="645" dy="0">權力要相當分散</tspan></text><text x="645" y="130.8" font-size="16" font-weight="400" fill="#1a1a1a" text-anchor="middle"><tspan x="645" dy="0">14:06 不集中在 IQ 一百億的 AI，也不集中在少</tspan><tspan x="645" dy="22.08">數人手上</tspan></text><path d="M225 174.08 L382.5 196.08" fill="none" stroke="#6b665d" stroke-width="2.4" marker-end="url(#ar)"/><path d="M645 174.08 L487.5 196.08" fill="none" stroke="#6b665d" stroke-width="2.4" marker-end="url(#ar)"/><text x="435" y="199.08" font-size="15" font-weight="400" fill="#5b5750" text-anchor="middle"><tspan x="435" dy="0">兩個都相信時</tspan></text><text x="435" y="220.08" font-size="16" font-weight="700" fill="#b3392b" text-anchor="middle"><tspan x="435" dy="0">14:18 三個很難的問題</tspan></text><rect x="30" y="226.08" width="256.667" height="77.2" rx="12" fill="#fffdf9" stroke="#b3392b" stroke-width="2" stroke-dasharray="7 5"/><text x="158.333" y="260.08" font-size="20" font-weight="700" fill="#b3392b" text-anchor="middle"><tspan x="158.333" dy="0">能多聰明？</tspan></text><text x="158.333" y="286.08" font-size="16" font-weight="400" fill="#1a1a1a" text-anchor="middle"><tspan x="158.333" dy="0">比最聰明的人再聰明多少</tspan></text><rect x="306.667" y="226.08" width="256.667" height="77.2" rx="12" fill="#fffdf9" stroke="#b3392b" stroke-width="2" stroke-dasharray="7 5"/><text x="435" y="260.08" font-size="20" font-weight="700" fill="#b3392b" text-anchor="middle"><tspan x="435" dy="0">能多快？</tspan></text><text x="435" y="286.08" font-size="16" font-weight="400" fill="#1a1a1a" text-anchor="middle"><tspan x="435" dy="0">允許的速度</tspan></text><rect x="583.333" y="226.08" width="256.667" height="77.2" rx="12" fill="#fffdf9" stroke="#b3392b" stroke-width="2" stroke-dasharray="7 5"/><text x="711.667" y="260.08" font-size="20" font-weight="700" fill="#b3392b" text-anchor="middle"><tspan x="711.667" dy="0">人跟得上嗎？</tspan></text><text x="711.667" y="286.08" font-size="16" font-weight="400" fill="#1a1a1a" text-anchor="middle"><tspan x="711.667" dy="0">要把人的理解力提升多少</tspan></text><path d="M435 307.28 L435 341.28" fill="none" stroke="#6b665d" stroke-width="2.4" marker-end="url(#ar)"/><rect x="120" y="347.28" width="630" height="77.2" rx="12" fill="#dff1e8" stroke="#0b5c51" stroke-width="2"/><text x="435" y="381.28" font-size="20" font-weight="700" fill="#0b5c51" text-anchor="middle"><tspan x="435" dy="0">14:35 他認為可解，只是要時間</tspan></text><text x="435" y="407.28" font-size="16" font-weight="400" fill="#1a1a1a" text-anchor="middle"><tspan x="435" dy="0">14:41 世界得一起同意限制怎麼訂、怎麼處理</tspan></text><text x="435" y="468.48" font-size="18" font-weight="700" fill="#6b665d" text-anchor="middle"><tspan x="435" dy="0">誰來訂、量什麼，這段沒有說</tspan></text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 557" width="420" height="557" role="img" aria-labelledby="t d" font-family='"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif'><title id="t">他描述的數學界反應：五天轉了一圈</title><desc id="d">時間軸：奧特曼在 22:09 到 23:17 轉述數學界近十天的反應。第 0 天：這是假的；第 1 天：我們完了，叫研究生轉系；第 3 天：OpenAI 做這件事很可怕，若這是理解更多數學的代價就不要；第 5 天左右：有一種數學工作結束了，但多數人做的是理解、溝通與呈現知識。這是講者的轉述，不是調查。本文歸納，非講者原圖。</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b5750"/></marker></defs><rect x="0" y="0" width="420" height="557" rx="14" fill="#fffdf9" stroke="#d9d3c7"/><text x="24" y="41" font-size="21" font-weight="700" fill="#1a1a1a" text-anchor="start"><tspan x="24" dy="0">他描述的數學界反應：五天轉了一圈</tspan></text><line x1="40" y1="95.2" x2="40" y2="476.16" stroke="#6b665d" stroke-width="3"/><circle cx="40" cy="95.2" r="9" fill="#6b665d"/><text x="60" y="100.2" font-size="17" font-weight="700" fill="#6b665d" text-anchor="start"><tspan x="60" dy="0">第 0 天</tspan></text><rect x="60" y="111.2" width="336" height="47.2" rx="12" fill="#efece5" stroke="#6b665d" stroke-width="2"/><text x="228" y="141.2" font-size="16" font-weight="400" fill="#1a1a1a" text-anchor="middle"><tspan x="228" dy="0">「這是假的」</tspan></text><circle cx="40" cy="192.4" r="9" fill="#b3392b"/><text x="60" y="197.4" font-size="17" font-weight="700" fill="#b3392b" text-anchor="start"><tspan x="60" dy="0">第 1 天</tspan></text><rect x="60" y="208.4" width="336" height="47.2" rx="12" fill="#fbe4e1" stroke="#b3392b" stroke-width="2"/><text x="228" y="238.4" font-size="16" font-weight="400" fill="#1a1a1a" text-anchor="middle"><tspan x="228" dy="0">「我們完了，叫研究生轉系」</tspan></text><circle cx="40" cy="289.6" r="9" fill="#b3392b"/><text x="60" y="294.6" font-size="17" font-weight="700" fill="#b3392b" text-anchor="start"><tspan x="60" dy="0">第 3 天</tspan></text><rect x="60" y="305.6" width="336" height="69.28" rx="12" fill="#fbe4e1" stroke="#b3392b" stroke-width="2"/><text x="228" y="335.6" font-size="16" font-weight="400" fill="#1a1a1a" text-anchor="middle"><tspan x="228" dy="0">「OpenAI 做這件事很可怕；若這是代價，</tspan><tspan x="228" dy="22.08">我們不要」</tspan></text><circle cx="40" cy="408.88" r="9" fill="#0b5c51"/><text x="60" y="413.88" font-size="17" font-weight="700" fill="#0b5c51" text-anchor="start"><tspan x="60" dy="0">第 5 天左右</tspan></text><rect x="60" y="424.88" width="336" height="69.28" rx="12" fill="#dff1e8" stroke="#0b5c51" stroke-width="2"/><text x="228" y="454.88" font-size="16" font-weight="400" fill="#1a1a1a" text-anchor="middle"><tspan x="228" dy="0">「有一種數學工作結束了，但多數人做的是</tspan><tspan x="228" dy="22.08">理解、溝通、呈現知識」</tspan></text><text x="210" y="532.16" font-size="16" font-weight="700" fill="#5b5750" text-anchor="middle"><tspan x="210" dy="0">22:09–23:17 奧特曼的轉述，不是調查</tspan></text></svg>

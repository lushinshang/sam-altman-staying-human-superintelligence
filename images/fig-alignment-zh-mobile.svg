<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 888" width="420" height="888" role="img" aria-labelledby="t d" font-family='"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif'><title id="t">對齊比預期容易，他為什麼反而擔心</title><desc id="d">因果圖：奧特曼說他原本以為對齊問題會更難；到目前對齊比預期容易，模型在一些重要面向已經遠超人類。但他完全不覺得下一代也會一樣容易是顯而易見的，而且對齊出錯的潛在代價大幅升高。他的排序是沙箱撐一陣子，沙箱失效後靠可監控性撐一陣子，最後只有對齊行得通，這也是他談速限的原因。他擔心世界上有些 AI 計畫因為到目前為止對齊很容易，就對對齊太有信心，太願意往前衝，他沒有點名是誰。時間是訪談中的位置。本文歸納，非講者原圖。</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b5750"/></marker></defs><rect x="0" y="0" width="420" height="888" rx="14" fill="#fffdf9" stroke="#d9d3c7"/><text x="24" y="41" font-size="21" font-weight="700" fill="#1a1a1a" text-anchor="start"><tspan x="24" dy="0">對齊比預期容易，他為什麼反而擔心</tspan></text><rect x="24" y="67.2" width="372" height="72.4" rx="12" fill="#efece5" stroke="#6b665d" stroke-width="2"/><text x="210" y="98.2" font-size="17" font-weight="700" fill="#6b665d" text-anchor="middle"><tspan x="210" dy="0">35:50 原本</tspan></text><text x="210" y="122.6" font-size="15" font-weight="400" fill="#1a1a1a" text-anchor="middle"><tspan x="210" dy="0">「我原本以為對齊問題會更難」</tspan></text><path d="M210 142.6 L210 164.6" fill="none" stroke="#6b665d" stroke-width="2.4" marker-end="url(#ar)"/><rect x="24" y="169.6" width="372" height="93.1" rx="12" fill="#dff1e8" stroke="#0b5c51" stroke-width="2"/><text x="210" y="200.6" font-size="17" font-weight="700" fill="#0b5c51" text-anchor="middle"><tspan x="210" dy="0">36:12 到目前</tspan></text><text x="210" y="225" font-size="15" font-weight="400" fill="#1a1a1a" text-anchor="middle"><tspan x="210" dy="0">對齊比預期容易；模型在一些重要面向已經遠</tspan><tspan x="210" dy="20.7">超人類</tspan></text><path d="M210 265.7 L210 287.7" fill="none" stroke="#6b665d" stroke-width="2.4" marker-end="url(#ar)"/><rect x="24" y="292.7" width="372" height="72.4" rx="12" fill="#fbe4e1" stroke="#b3392b" stroke-width="2"/><text x="210" y="323.7" font-size="17" font-weight="700" fill="#b3392b" text-anchor="middle"><tspan x="210" dy="0">36:29 下一代也會一樣容易？</tspan></text><text x="210" y="348.1" font-size="15" font-weight="400" fill="#1a1a1a" text-anchor="middle"><tspan x="210" dy="0">「我其實完全不覺得這是顯而易見的」</tspan></text><path d="M210 368.1 L210 390.1" fill="none" stroke="#b3392b" stroke-width="2.4" marker-end="url(#ar)"/><rect x="24" y="395.1" width="372" height="54.4" rx="12" fill="#fbe4e1" stroke="#b3392b" stroke-width="2"/><text x="210" y="426.1" font-size="17" font-weight="700" fill="#b3392b" text-anchor="middle"><tspan x="210" dy="0">36:33 而且對齊出錯的潛在代價大幅升高</tspan></text><text x="210" y="489.5" font-size="16" font-weight="700" fill="#1f5f99" text-anchor="middle"><tspan x="210" dy="0">36:59 他的排序，也是他談速限的原因</tspan></text><rect x="40" y="498.7" width="340" height="53.2" rx="12" fill="#e3ecfb" stroke="#1f5f99" stroke-width="2"/><text x="210" y="528.7" font-size="16" font-weight="700" fill="#1f5f99" text-anchor="middle"><tspan x="210" dy="0">沙箱能撐一陣子</tspan></text><path d="M210 553.9 L210 571.9" fill="none" stroke="#1f5f99" stroke-width="2.4" marker-end="url(#ar)"/><rect x="40" y="575.9" width="340" height="53.2" rx="12" fill="#e3ecfb" stroke="#1f5f99" stroke-width="2"/><text x="210" y="605.9" font-size="16" font-weight="700" fill="#1f5f99" text-anchor="middle"><tspan x="210" dy="0">沙箱失效後，可監控性撐一陣子</tspan></text><path d="M210 631.1 L210 649.1" fill="none" stroke="#1f5f99" stroke-width="2.4" marker-end="url(#ar)"/><rect x="40" y="653.1" width="340" height="53.2" rx="12" fill="#e3ecfb" stroke="#1f5f99" stroke-width="2"/><text x="210" y="683.1" font-size="16" font-weight="700" fill="#1f5f99" text-anchor="middle"><tspan x="210" dy="0">最後只有對齊行得通</tspan></text><rect x="24" y="732.3" width="372" height="101.32" rx="12" fill="#fffdf9" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="7 5"/><text x="210" y="763.3" font-size="17" font-weight="700" fill="#1a1a1a" text-anchor="middle"><tspan x="210" dy="0">37:23 他擔心有些 AI 計畫，因為到目前為止</tspan><tspan x="210" dy="23.46">對齊很容易，就對對齊太有信心，太願意</tspan><tspan x="210" dy="23.46">往前衝</tspan></text><text x="210" y="863.62" font-size="16" font-weight="700" fill="#6b665d" text-anchor="middle"><tspan x="210" dy="0">他沒有點名是誰</tspan></text></svg>

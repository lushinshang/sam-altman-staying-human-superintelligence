<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 870 561" width="870" height="561" role="img" aria-labelledby="t d" font-family='"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif'><title id="t">對齊比預期容易，他為什麼反而擔心</title><desc id="d">因果圖：奧特曼說他原本以為對齊問題會更難；到目前對齊比預期容易，模型在一些重要面向已經遠超人類。但他完全不覺得下一代也會一樣容易是顯而易見的，而且對齊出錯的潛在代價大幅升高。他的排序是沙箱撐一陣子，沙箱失效後靠可監控性撐一陣子，最後只有對齊行得通，這也是他談速限的原因。他擔心世界上有些 AI 計畫因為到目前為止對齊很容易，就對對齊太有信心，太願意往前衝，他沒有點名是誰。時間是訪談中的位置。本文歸納，非講者原圖。</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b5750"/></marker></defs><rect x="0" y="0" width="870" height="561" rx="14" fill="#fffdf9" stroke="#d9d3c7"/><text x="30" y="44" font-size="24" font-weight="700" fill="#1a1a1a" text-anchor="start"><tspan x="30" dy="0">對齊比預期容易，他為什麼反而擔心</tspan></text><rect x="30" y="70.8" width="240.667" height="124.3" rx="12" fill="#efece5" stroke="#6b665d" stroke-width="2"/><text x="150.333" y="103.8" font-size="19" font-weight="700" fill="#6b665d" text-anchor="middle"><tspan x="150.333" dy="0">35:50 原本</tspan></text><text x="150.333" y="129.6" font-size="16" font-weight="400" fill="#1a1a1a" text-anchor="middle"><tspan x="150.333" dy="0">「我原本以為對齊問題會更難」</tspan></text><path d="M275.667 132.95 L309.667 132.95" fill="none" stroke="#6b665d" stroke-width="2.4" marker-end="url(#ar)"/><rect x="314.667" y="70.8" width="240.667" height="124.3" rx="12" fill="#dff1e8" stroke="#0b5c51" stroke-width="2"/><text x="435" y="103.8" font-size="19" font-weight="700" fill="#0b5c51" text-anchor="middle"><tspan x="435" dy="0">36:12 到目前</tspan></text><text x="435" y="129.6" font-size="16" font-weight="400" fill="#1a1a1a" text-anchor="middle"><tspan x="435" dy="0">對齊比預期容易；模型在一些</tspan><tspan x="435" dy="22.08">重要面向已經遠超人類</tspan></text><path d="M560.333 132.95 L594.333 132.95" fill="none" stroke="#6b665d" stroke-width="2.4" marker-end="url(#ar)"/><rect x="599.333" y="70.8" width="240.667" height="124.3" rx="12" fill="#fbe4e1" stroke="#b3392b" stroke-width="2"/><text x="719.667" y="103.8" font-size="19" font-weight="700" fill="#b3392b" text-anchor="middle"><tspan x="719.667" dy="0">36:29 下一代也會一樣</tspan><tspan x="719.667" dy="26.22">容易？</tspan></text><text x="719.667" y="155.82" font-size="16" font-weight="400" fill="#1a1a1a" text-anchor="middle"><tspan x="719.667" dy="0">「我其實完全不覺得這是顯而</tspan><tspan x="719.667" dy="22.08">易見的」</tspan></text><path d="M719.667 199.1 L719.667 225.1" fill="none" stroke="#b3392b" stroke-width="2.4" marker-end="url(#ar)"/><rect x="30" y="229.1" width="810" height="56.8" rx="12" fill="#fbe4e1" stroke="#b3392b" stroke-width="2"/><text x="435" y="262.1" font-size="19" font-weight="700" fill="#b3392b" text-anchor="middle"><tspan x="435" dy="0">36:33 而且對齊出錯的潛在代價大幅升高</tspan></text><text x="435" y="332.9" font-size="17" font-weight="700" fill="#1f5f99" text-anchor="middle"><tspan x="435" dy="0">36:59 他的排序，也是他談速限的原因</tspan></text><rect x="30" y="344.3" width="246" height="75.28" rx="12" fill="#e3ecfb" stroke="#1f5f99" stroke-width="2"/><text x="153" y="374.3" font-size="16" font-weight="700" fill="#1f5f99" text-anchor="middle"><tspan x="153" dy="0">沙箱能撐一陣子</tspan></text><path d="M281 381.94 L307 381.94" fill="none" stroke="#1f5f99" stroke-width="2.4" marker-end="url(#ar)"/><rect x="312" y="344.3" width="246" height="75.28" rx="12" fill="#e3ecfb" stroke="#1f5f99" stroke-width="2"/><text x="435" y="374.3" font-size="16" font-weight="700" fill="#1f5f99" text-anchor="middle"><tspan x="435" dy="0">沙箱失效後，可監控性撐</tspan><tspan x="435" dy="22.08">一陣子</tspan></text><path d="M563 381.94 L589 381.94" fill="none" stroke="#1f5f99" stroke-width="2.4" marker-end="url(#ar)"/><rect x="594" y="344.3" width="246" height="75.28" rx="12" fill="#e3ecfb" stroke="#1f5f99" stroke-width="2"/><text x="717" y="374.3" font-size="16" font-weight="700" fill="#1f5f99" text-anchor="middle"><tspan x="717" dy="0">最後只有對齊行得通</tspan></text><rect x="30" y="449.58" width="810" height="55.6" rx="12" fill="#fffdf9" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="7 5"/><text x="435" y="481.58" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle"><tspan x="435" dy="0">37:23 他擔心有些 AI 計畫，因為到目前為止對齊很容易，就對對齊太有信心，太願意往前衝</tspan></text><text x="435" y="536.18" font-size="17" font-weight="700" fill="#6b665d" text-anchor="middle"><tspan x="435" dy="0">他沒有點名是誰</tspan></text></svg>
